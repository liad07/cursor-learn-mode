name: Temporary KAN stream lookup

on:
  push:
    branches:
      - tmp-kan-m3u8-1073670
  pull_request:
    branches:
      - main

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch KAN program API and episode page
        shell: bash
        run: |
          set -euxo pipefail
          API='https://mobapi.kan.org.il/api/mobile/program?id=1073649'
          PAGE='https://www.kan.org.il/content/kan/kan-11/p-1073649/s1/1073670/'

          echo '=== API HTTP ==='
          curl -L --compressed -A 'Mozilla/5.0' -e 'https://www.kan.org.il/' -sS -D /tmp/api.headers "$API" -o /tmp/api.json || true
          cat /tmp/api.headers || true
          echo '=== API SIZE ==='
          wc -c /tmp/api.json || true

          echo '=== MATCHED ENTRY ==='
          jq -c '.entry[]? | select((.id|tostring)=="1073670")' /tmp/api.json || true
          echo '=== CONTENT SRC ==='
          jq -r '.entry[]? | select((.id|tostring)=="1073670") | .content.src // empty' /tmp/api.json || true

          echo '=== PAGE HTTP ==='
          curl -L --compressed -A 'Mozilla/5.0' -sS -D /tmp/page.headers "$PAGE" -o /tmp/page.html || true
          cat /tmp/page.headers || true
          echo '=== PAGE SIZE ==='
          wc -c /tmp/page.html || true

          echo '=== PAGE HLS CANDIDATES ==='
          python3 - <<'PY'
          import re, html
          p=open('/tmp/page.html','r',errors='ignore').read()
          vals=[]
          for pat in [r'data-hls-url=["\']([^"\']+)', r'https?://[^"\'<> ]+\.m3u8[^"\'<> ]*', r'contentUrl["\']?\s*[:=]\s*["\']([^"\']+)']:
              for m in re.findall(pat,p,re.I):
                  if isinstance(m, tuple): m=m[0]
                  m=html.unescape(m).replace('\\u0026','&').replace('\\/','/')
                  if m not in vals: vals.append(m)
          for v in vals:
              print(v)
          PY
